<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tandem Demo</title>
<meta name="description" content="Tandem: a shared AI governance record for product, engineering and privacy teams. Interactive demo with a fictional company.">
<link rel="stylesheet" href="assets/intandem.css">
<style>
  /* App layout, built from InTandem tokens */
  [hidden] { display: none !important; }

  /* Role screen */
  .role-screen { max-width: 960px; margin: 0 auto; padding: var(--space-10) var(--space-4); }
  .role-screen .display { margin-bottom: var(--space-2); }
  .role-intro { max-width: 640px; color: var(--ink-muted); margin: var(--space-4) 0 var(--space-6); }
  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); }
  .role-card { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface-raised); border: 1px solid var(--hairline); box-shadow: var(--shadow-soft); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-2); transition: box-shadow .16s ease; }
  .role-card:hover { box-shadow: var(--shadow-lifted); }
  .role-card .role-who { color: var(--forest); }
  .role-card .role-sees { color: var(--ink-muted); border-top: 1px solid var(--hairline); padding-top: var(--space-2); margin-top: auto; }
  .role-note { color: var(--ink-muted); margin: var(--space-6) 0; max-width: 640px; }

  /* Shell */
  .topbar { background: var(--surface-raised); border-bottom: 1px solid var(--hairline); box-shadow: var(--shadow-soft); position: sticky; top: 0; z-index: 10; }
  .topbar-inner { display: flex; align-items: center; gap: var(--space-4); padding: 10px var(--space-6); flex-wrap: wrap; }
  .wordmark { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 28px; color: var(--ink); text-decoration: none; }
  .demo-badge { color: var(--ink-muted); }
  .role-pills { display: flex; gap: var(--space-1); margin-left: auto; flex-wrap: wrap; }
  .role-pill { font: inherit; cursor: pointer; background: transparent; color: var(--ink-muted); border: 1px solid transparent; padding: 6px 10px; }
  .role-pill:hover { color: var(--forest); border-color: var(--hairline); }
  .role-pill[aria-pressed="true"] { background: var(--forest-tint); color: var(--ink); border-color: var(--forest-tint); }
  .role-select { display: none; margin-left: auto; }
  .avatar { width: 32px; height: 32px; border-radius: var(--radius-round); background: var(--forest); color: var(--on-forest); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }

  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 53px); }
  .sidenav { border-right: 1px solid var(--hairline); padding: var(--space-6) var(--space-4); background: var(--surface); }
  .sidenav-label { color: var(--ink-muted); padding: 0 var(--space-2); margin-bottom: var(--space-2); }
  .nav-list { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { font: inherit; font-size: 15px; text-align: left; cursor: pointer; border: 0; background: transparent; color: var(--ink); padding: 8px var(--space-2); display: flex; align-items: center; gap: var(--space-2); text-decoration: none; }
  .nav-item:hover { background: var(--vellum); }
  .nav-item[aria-current="page"] { background: var(--forest-tint); font-weight: 500; }
  .nav-count { margin-left: auto; font-size: 11px; line-height: 16px; padding: 1px 6px; background: var(--burgundy-tint); color: var(--ink); white-space: nowrap; }
  .nav-sep { border-top: 1px solid var(--hairline); margin: var(--space-4) 0; }
  .main { padding: var(--space-10) var(--space-6); max-width: 1040px; width: 100%; }

  /* Views */
  .view-banner { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--ink-muted); background: var(--vellum); padding: var(--space-2) var(--space-4); margin-bottom: var(--space-6); }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); align-items: start; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6); }
  .stat { background: var(--surface-raised); border: 1px solid var(--hairline); box-shadow: var(--shadow-soft); padding: var(--space-4) var(--space-6); }
  .stat-value { font-family: var(--font-display); font-weight: 600; font-size: 36px; line-height: 44px; }
  .stat-sub { color: var(--ink-muted); }
  .stack { display: flex; flex-direction: column; gap: var(--space-4); }
  .mt-6 { margin-top: var(--space-6); }
  .mt-10 { margin-top: var(--space-10); }

  .sys-row { display: flex; align-items: center; gap: 12px; padding: var(--space-4) 0; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
  .sys-row:last-child { border-bottom: 0; }
  .sys-row-name { font-weight: 500; min-width: 0; flex: 1 1 220px; }
  button.sys-row { width: 100%; font: inherit; color: inherit; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--hairline); cursor: pointer; }
  button.sys-row:hover .sys-row-name { color: var(--forest); text-decoration: underline; text-underline-offset: 2px; }
  .sys-row-meta { color: var(--ink-muted); }

  .lifecycle { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-1); }
  .lc-bar { height: 6px; background: var(--stone); }
  .lc-done .lc-bar { background: var(--forest); }
  .lc-active .lc-bar { background: var(--bronze); }
  .lc-blocked .lc-bar { background: var(--burgundy); }
  .lc-label { font-size: 12px; line-height: 16px; color: var(--ink-muted); margin-top: 6px; overflow-wrap: anywhere; }
  .lc-active .lc-label, .lc-blocked .lc-label { color: var(--ink); font-weight: 600; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { position: relative; padding: 0 0 var(--space-4) var(--space-6); border-left: 1px solid var(--hairline); margin-left: 5px; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before { content: ""; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; background: var(--forest); }
  .timeline li.t-block::before { background: var(--burgundy); }
  .timeline li.t-flag::before { background: var(--bronze); }
  .t-time { color: var(--ink-muted); }
  .t-title { font-weight: 500; }

  .option-list { display: flex; flex-direction: column; gap: var(--space-2); }
  .option { border: 1px solid var(--hairline); padding: var(--space-4); background: var(--surface-raised); }
  .option-title { font-weight: 500; }

  /* Forms */
  .field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-4); }
  .field label, .field .field-label { font-size: 14px; line-height: 20px; font-weight: 500; }
  .field input, .field select, .field textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%; min-width: 0; }
  .field textarea { min-height: 88px; resize: vertical; }
  .hint { color: var(--ink-muted); }
  .req { color: var(--burgundy); }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-4); }
  .form-section { margin: var(--space-6) 0 var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--hairline); }
  .form-section:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin-top: var(--space-6); }
  .btn-row.between { justify-content: space-between; }

  .steps { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); flex-wrap: wrap; counter-reset: step; }
  .step { display: flex; align-items: center; gap: var(--space-2); color: var(--ink-muted); padding: 6px 10px; border: 1px solid var(--hairline); background: var(--surface-raised); }
  .step-num { width: 22px; height: 22px; border-radius: var(--radius-round); display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--stone); color: var(--ink); }
  .step.is-active { color: var(--ink); border-color: var(--forest); }
  .step.is-active .step-num { background: var(--forest); color: var(--on-forest); }
  .step.is-done .step-num { background: var(--forest-tint); }

  .type-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
  .type-card { font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface-raised); border: 1px solid var(--hairline); box-shadow: var(--shadow-soft); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-2); }
  .type-card[aria-pressed="true"] { border-color: var(--forest); box-shadow: var(--shadow-lifted); background: linear-gradient(135deg, var(--forest-tint) 0%, var(--surface-raised) 100%); }

  .risk-q { border: 1px solid var(--hairline); padding: var(--space-4); margin-bottom: var(--space-2); background: var(--surface-raised); }
  .risk-q fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .risk-q legend { font-weight: 500; margin-bottom: var(--space-2); padding: 0; }
  .radio { display: flex; gap: var(--space-2); align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .radio input { margin-top: 5px; accent-color: var(--forest); }
  .meter { height: 8px; background: var(--stone); margin: var(--space-2) 0; }
  .meter-fill { height: 100%; background: var(--forest); width: 0; transition: width .2s ease; }
  .tier { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 32px; }

  .role-row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px solid var(--hairline); }
  .role-row:last-child { border-bottom: 0; }
  .role-row .avatar { background: var(--vellum); color: var(--ink); }

  .bars { display: flex; flex-direction: column; gap: var(--space-2); }
  .bar-row { display: grid; grid-template-columns: 140px minmax(0, 1fr) 28px; gap: var(--space-2); align-items: center; }
  .bar-track { height: 10px; background: var(--stone); }
  .bar-fill { height: 100%; background: var(--forest); }
  .bar-val { text-align: right; font-weight: 600; }

  .finding-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .quote { font-family: var(--font-sans); border-left: 2px solid var(--hairline); padding-left: var(--space-4); color: var(--ink); }
  .counsel-chip { display: inline-flex; gap: var(--space-2); align-items: center; padding: 3px 8px; background: var(--stone); }

  .toasts { position: fixed; bottom: var(--space-6); right: var(--space-6); display: flex; flex-direction: column; gap: var(--space-2); z-index: 50; max-width: calc(100vw - 32px); }
  .toast { background: var(--ink); color: var(--surface-raised); padding: 10px 16px; box-shadow: var(--shadow-lifted); font-size: 14px; line-height: 20px; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .sidenav { border-right: 0; border-bottom: 1px solid var(--hairline); padding: var(--space-2) var(--space-4); overflow-x: auto; }
    .sidenav-label, .nav-sep, .nav-extra { display: none; }
    .nav-list { flex-direction: row; gap: var(--space-1); }
    .nav-item { white-space: nowrap; }
    .role-pills { display: none; }
    .role-select { display: inline-flex; }
    .main { padding: var(--space-6) var(--space-4); }
    .grid-2, .form-grid, .type-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .display { font-size: 40px; line-height: 46px; }
    .heading-1 { font-size: 28px; line-height: 34px; }
    .topbar-inner { padding: 8px var(--space-4); gap: var(--space-2); }
    .demo-badge { display: none; }
    .bar-row { grid-template-columns: 110px minmax(0, 1fr) 24px; }
    .it-toolbar .it-count { margin-left: 0; flex-basis: 100%; }
    .it-card { padding: var(--space-4); }
  }
</style>
</head>
<body>

<div id="role-screen" class="role-screen"></div>
<div id="app" hidden>
  <header class="topbar"><div class="topbar-inner" id="topbar"></div></header>
  <div class="shell">
    <nav class="sidenav" id="sidenav" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* ───────── helpers ───────── */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var PATHS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  cross: '<path d="M7 7l10 10M17 7L7 17"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/>',
  dot: '<circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>',
  pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/>',
  alert: '<path d="M12 3.5L21.5 20h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none"/>',
  seal: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.5"/><path d="M9.6 12.2l1.7 1.7 3.2-3.4"/>',
  scales: '<path d="M12 3v18M7 21h10M4 7h16"/><path d="M6 7l-3 6a3 3 0 0 0 6 0zM18 7l-3 6a3 3 0 0 0 6 0z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  lock: '<rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  out: '<path d="M14 5h5v5M19 5l-8 8M17 14v5H5V7h5"/>'
};
function icon(name, size, cls) {
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true" class="' + (cls || '') + '" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">' + PATHS[name] + '</svg>';
}
var TAG_ICON = { pass: 'check', fail: 'cross', review: 'clock', neutral: 'dot' };
function tag(tone, text) { return '<span class="label it-tag it-tag-' + tone + '">' + icon(TAG_ICON[tone], 12, 'it-tag-icon') + esc(text) + '</span>'; }
function btn(text, variant, size, onclick, extra) {
  return '<button type="button" class="it-btn it-btn-' + (variant || 'primary') + ' it-btn-' + (size || 'md') + '"' + (onclick ? ' onclick="' + onclick + '"' : '') + (extra || '') + '>' + text + '</button>';
}
var CALLOUT = { note: ['pen', 'Note'], warning: ['alert', 'Warning'], featured: ['seal', 'Key provision'] };
function callout(tone, bodyHtml, opts) {
  opts = opts || {};
  return '<aside class="it-callout it-callout-' + tone + (opts.cls ? ' ' + opts.cls : '') + '"' + (tone === 'warning' ? ' role="note"' : '') + '>' +
    '<div class="it-callout-head">' + icon(CALLOUT[tone][0], 20, 'it-callout-icon') + '<span class="label it-callout-label">' + (opts.label || CALLOUT[tone][1]) + '</span>' +
    (opts.reference ? '<span class="label it-callout-ref">' + esc(opts.reference) + '</span>' : '') + '</div>' +
    (opts.title ? '<h3 class="heading-3 it-callout-title">' + esc(opts.title) + '</h3>' : '') +
    '<div class="body it-callout-body">' + bodyHtml + '</div></aside>';
}
function asof(date, iso, source, verb) {
  return '<p class="label it-asof">' + icon('clock', 14, 'it-asof-icon') + '<span>' + esc(verb || 'Checked') + ' <time datetime="' + iso + '">' + esc(date) + '</time></span>' +
    (source ? '<span class="it-asof-source">· ' + esc(source) + '</span>' : '') + '</p>';
}
function pageHead(title, subtitle, after) {
  return '<div class="it-page-head"><h1 class="heading-1">' + esc(title) + '</h1><div class="it-rule"></div>' +
    (subtitle ? '<p class="body muted">' + subtitle + '</p>' : '') + (after || '') + '</div>';
}
function rec(o) {
  var fields = o.fields.map(function (f) {
    return '<div class="it-rec-field"><dt class="label it-rec-label">' + esc(f.label) + '</dt><dd class="body-small it-rec-value">' + f.html + '</dd></div>';
  }).join('');
  return '<details class="it-rec" id="rec-' + o.id + '"' + (o.open ? ' open' : '') + ' ontoggle="cardToggled(\'' + o.id + '\', this.open)">' +
    '<summary class="it-rec-summary">' + icon('right', 16, 'it-rec-chevron') + '<span class="it-rec-name">' + o.name + '</span>' +
    (o.status ? tag(o.status[0], o.status[1]) : '') + (o.reference ? '<span class="it-rec-ref">' + esc(o.reference) + '</span>' : '') +
    '</summary><dl class="it-rec-fields">' + fields + '</dl></details>';
}
function disclaimer() {
  return '<aside class="it-disclaimer it-site-footer">' + icon('scales', 20, 'it-disclaimer-icon') +
    '<p class="body-small it-disclaimer-text"><strong>Not legal advice.</strong> Tandem is an informational demo of a workflow tool for product teams. It doesn\'t give legal advice, and using it doesn\'t create an attorney-client relationship with anyone. Neffy Analytics, its people and its policies are fictional. Confirm anything legal with your own counsel.</p></aside>';
}
function lifecycle(state) {
  var stages = ['Registered', 'In review', 'Approved', 'Production', 'Decommission'];
  return '<div class="lifecycle" role="list">' + stages.map(function (s, i) {
    var c = state[i] || '';
    var word = c === 'done' ? ' (complete)' : c === 'active' ? ' (current)' : c === 'blocked' ? ' (blocked)' : '';
    return '<div class="lc-' + (c || 'todo') + '" role="listitem"><div class="lc-bar"></div><div class="lc-label">' + s + '<span class="sr-only" style="position:absolute;left:-9999px">' + word + '</span></div></div>';
  }).join('') + '</div>';
}
function timeline(items) {
  return '<ol class="timeline">' + items.map(function (t) {
    return '<li class="' + (t.kind ? 't-' + t.kind : '') + '"><div class="body-small t-time">' + esc(t.time) + '</div><div class="t-title">' + esc(t.title) + '</div>' + (t.note ? '<div class="body-small muted">' + esc(t.note) + '</div>' : '') + '</li>';
  }).join('') + '</ol>';
}
function stat(label, value, sub) { return '<div class="stat"><div class="label muted">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div><div class="body-small stat-sub">' + esc(sub) + '</div></div>'; }
function toast(msg) {
  var w = document.getElementById('toasts'), t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; w.appendChild(t);
  setTimeout(function () { t.remove(); }, 3800);
}
function nowLabel() { return new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }

/* ───────── roles ───────── */
var ROLES = {
  implementer: { label: 'Implementer', who: 'J. Park', title: 'Product lead', initials: 'JP', home: 'impl-dashboard',
    nav: [['impl-dashboard', 'My systems'], ['impl-register', 'Register a system'], ['impl-rtb', 'Neffy RTB model'], ['impl-record', 'Resume screening', '1 block']] },
  reviewer: { label: 'Reviewer', who: 'Marcus Webb', title: 'Privacy & ethics reviewer', initials: 'MW', home: 'rev-dashboard',
    nav: [['rev-dashboard', 'My review queue'], ['rev-review', 'Active review', '1 block']] },
  owner: { label: 'Accountable owner', who: 'Sarah Chen', title: 'VP, People Operations', initials: 'SC', home: 'owner-dashboard',
    nav: [['owner-dashboard', 'Unit overview'], ['owner-dispute', 'Dispute a block', '1']] },
  executive: { label: 'Executive', who: 'Governance committee', title: 'Org-wide view', initials: 'GC', home: 'exec-dashboard',
    nav: [['exec-dashboard', 'Governance posture']] },
  governance: { label: 'Governance lead', who: 'Priya Natarajan', title: 'Governance lead', initials: 'PN', home: 'gov-queue',
    nav: [['gov-policies', 'Policy set'], ['gov-queue', 'Findings queue', 'open'], ['gov-summaries', 'Review summaries']] }
};
var ROLE_ORDER = ['implementer', 'reviewer', 'owner', 'executive', 'governance'];

/* ───────── demo data ───────── */
var POLICY_SET = 'v2026.04.19-001';
var FINDINGS = [
  { id: 'health-signals', type: 'conflict', title: 'Pharmacy and health browsing signals are a prohibited input', policies: 'Policy 06 §2, §4',
    detail: 'The intake lists pharmacy and health-content browsing as an active model input. Neffy\'s Sensitive Data Policy prohibits health-related behavioral signals, including pharmacy browsing, with no business-case exceptions. Policy 02 in this policy set says CPO sign-off doesn\'t create an exception, so the input has to come out.',
    cite: 'Policy 06 §2: "Health and medical data including data inferred from pharmacy browsing…prohibited." §4: "There are no business-case exceptions to these prohibitions."' },
  { id: 'inventory-age', type: 'conflict', title: 'Open-web inventory without model-level age exclusions', policies: 'Policy 08 §4',
    detail: 'The intake says the model runs on open-web and mobile app inventory, with age exclusions left to each advertiser\'s campaign settings. Neffy\'s Children\'s Data Policy requires exclusions in the model itself; campaign settings alone don\'t satisfy it.',
    cite: 'Policy 08 §4: "Inventory exclusions must be implemented at the model level, not delegated solely to advertiser campaign settings."' },
  { id: 'purpose', type: 'pass', title: 'Attribution sharing matches the Privacy Policy\'s listed purposes', policies: 'Policy 03 §3',
    detail: 'The current Privacy Policy lists campaign measurement and attribution, including sharing impression and conversion signals with measurement partners, as a processing purpose. The intake\'s attribution sharing falls inside it.',
    cite: 'Policy 03 §3: "Neffy processes personal data for…campaign measurement and attribution, including sharing impression and conversion signals with measurement partners."' },
  { id: 'retention', type: 'gap', title: 'Training data retention period is blank', policies: 'Policy 01 §3',
    detail: 'Neffy\'s Data Governance Policy limits training data built from behavioral logs to 90 days unless the Chief Data Officer approves a longer period in writing. The intake left the retention field empty. The builder needs to state the period, and get CDO approval if it runs past 90 days.',
    cite: 'Policy 01 §3: "Training datasets derived from behavioral logs are subject to the same 90-day retention limit…unless a documented business justification…is approved in writing by the Chief Data Officer."' },
  { id: 'consent', type: 'gap', title: 'No independent consent check where minors may be in the audience', policies: 'Policy 04 §3',

function calcRisk() {
  var total = 0, possible = 0, answered = 0;
  RISK_QS.forEach(function (q, i) {
    var sel = document.querySelector('input[name=rq' + i + ']:checked');
    if (sel) { total += +sel.value * q.w; answered++; S.reg['rq' + i] = +sel.value; }
    possible += 3 * q.w;
  });
  var meter = document.getElementById('meter'); if (!meter) return;
  if (!answered) return;
  var pct = Math.round(total / possible * 100), tier, msg, tone = 'note';
  if (pct < 50) { tier = 'Low risk'; msg = 'Standard path. The privacy & ethics reviewer is assigned for a light review.'; }
  else if (pct < 75) { tier = 'Moderate risk'; msg = 'Privacy & ethics and policy reviewers are assigned. Bias documentation is requested.'; }
  else { tier = 'High risk'; tone = 'warning'; msg = 'Full review. Privacy & ethics, policy and security reviewers are assigned, and a community liaison is recommended. Talk to your counsel before launch.'; }
  meter.style.width = pct + '%';
  meter.style.background = tone === 'warning' ? 'var(--burgundy)' : 'var(--forest)';
  document.getElementById('tier').textContent = tier;
  document.getElementById('score').textContent = pct + ' / 100' + (answered < RISK_QS.length ? ' · ' + (RISK_QS.length - answered) + ' unanswered' : '');
  document.getElementById('risk-callout').innerHTML = callout(tone, '<p>' + msg + '</p>');
}

    var inp = document.querySelector('.it-search-input'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  } else render();
}
function setCounsel(k, v) { S.counsel[k] = v; render(); }
function decide(id, status) {
  S.findings[id] = { status: status, at: nowLabel() };
  S.findingOpen[id] = true;
  var f = FINDINGS.filter(function (x) { return x.id === id; })[0];
  S.log.push({ time: nowLabel(), title: STATUS_TAG[status][1] + ': ' + f.title, note: 'Set by Priya Natarajan, governance lead.', kind: status === 'blocked' ? 'block' : 'flag' });
  toast(STATUS_TAG[status][1] + '. Logged to the record.');
  render();
}
function closeReview() {
  S.closed = true; S.closedAt = nowLabel();
  S.log.push({ time: S.closedAt, title: 'Review closed', note: 'Summary exported. Counsel consulted: ' + (S.counsel.consulted || 'Not recorded') + (S.counsel.date ? ', ' + S.counsel.date : '') + '.', kind: 'flag' });
  toast('Review closed. Summary added to Review summaries.');
  go('gov-summaries');
}

function summaryText() {
  var lines = ['Tandem review summary', 'System: Neffy RTB Audience Segmentation Model v2.4.1 (RTB-001)', 'Registered by: J. Park', 'Policy set: ' + POLICY_SET,
    'Review closed: ' + S.closedAt + ' by Priya Natarajan, governance lead',
    'Counsel consulted: ' + (S.counsel.consulted || 'Not recorded') + (S.counsel.date ? ' (' + S.counsel.date + ')' : ''), '', 'Findings'];
  FINDINGS.forEach(function (f) {
    var st = S.findings[f.id];
    lines.push('- [' + (st ? STATUS_TAG[st.status][1] : TYPE_TAG[f.type][1]) + '] ' + f.title + ' (' + f.policies + ')' + (st ? ' · set ' + st.at : ''));
  });
  lines.push('', 'Not legal advice. This summary records workflow status against the organization\'s own policies. Neffy Analytics is fictional.');
  return lines.join('\n');
}
function downloadSummary() {
  try {
    var blob = new Blob([summaryText()], { type: 'text/plain' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Tandem_Review_Summary_RTB-001.txt';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch (e) { toast('Download isn\'t available in this browser.'); }
}

VIEWS['gov-summaries'] = function () {
  var cards = [];
  if (S.closed) {
    cards.push(rec({ id: 'sum-rtb', name: 'Neffy RTB Audience Segmentation Model v2.4.1', reference: 'RTB-001 · ' + POLICY_SET, status: [blockedCount() ? 'fail' : 'pass', closedLabel()], open: true, fields: [
      { label: 'Closed', html: esc(S.closedAt) + ' by Priya Natarajan' },
      { label: 'Counsel consulted', html: esc((S.counsel.consulted || 'Not recorded') + (S.counsel.date ? ' · ' + S.counsel.date : '')) },
      { label: 'Findings', html: FINDINGS.map(function (f) { var st = S.findings[f.id]; return tag.apply(null, st ? STATUS_TAG[st.status] : TYPE_TAG[f.type]) + ' ' + esc(f.title); }).join('<br>') },
      { label: 'Export', html: btn('Download summary', 'secondary', 'sm', 'downloadSummary()') }] }));
  }
  cards.push(rec({ id: 'sum-hr8', name: 'Onboarding Chatbot', reference: 'HR-008 · v2026.01.12-002', status: ['pass', 'Closed: approved'], fields: [
    { label: 'Closed', html: 'February 2, 2026 by Priya Natarajan' }, { label: 'Counsel consulted', html: 'No' },
    { label: 'Findings', html: '4 matched policy. 1 missing item supplied before close.' }] }));
  return pageHead('Review summaries', 'One summary per closed review: system, policy set, each finding\'s status, owner and date, and whether counsel was consulted.') +
    '<div class="it-list">' + cards.join('') + '</div>' +
    (S.closed ? '' : '<p class="body-small muted mt-6">The Neffy RTB review shows up here once it\'s closed in the findings queue.</p>') +
    '<div class="mt-6">' + callout('note', '<p>A summary records workflow status against your own policies. It holds no signatures, no legal reasoning and nothing counsel said. If someone asks for a legal opinion on a system, that comes from counsel, not from this record.</p>', { label: 'What a summary is' }) + '</div>';
};

renderRoleScreen();
</script>
