<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Tandem: how a system moves from intake to production</title>
  <desc id="d">Three entry paths feed an adaptive intake and risk scoring, which create one shared system record. Five role views read the record. The system moves through a five-stage lifecycle, and every flag, block, override and approval is kept on a permanent record of who, what and when. Counsel sits outside Tandem.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d5850"/></marker>
  </defs>
  <rect width="1200" height="860" fill="#f7f3ea"/>

  <!-- Title -->
  <text x="48" y="64" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="600" fill="#1b2620">Tandem</text>
  <text x="48" y="92" font-size="16" fill="#4d5850">How an AI system moves from intake to production</text>
  <line x1="48" y1="108" x2="1152" y2="108" stroke="#1f4d3a" stroke-width="2"/>
  <line x1="48" y1="112" x2="1152" y2="112" stroke="#ddd4c2" stroke-width="1"/>

  <!-- Entry paths -->
  <text x="48" y="150" font-size="12" font-weight="600" letter-spacing="1" fill="#4d5850">HOW IT ARRIVES</text>
  <g font-size="14">
    <rect x="48" y="164" width="240" height="72" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="68" y="194" font-size="17" font-weight="600" fill="#1b2620">Built</text>
    <text x="68" y="218" fill="#4d5850">Engineering built it internally</text>
    <rect x="304" y="164" width="240" height="72" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="324" y="194" font-size="17" font-weight="600" fill="#1b2620">Bought</text>
    <text x="324" y="218" fill="#4d5850">A vendor's tool, bought in</text>
    <rect x="560" y="164" width="240" height="72" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="580" y="194" font-size="17" font-weight="600" fill="#1b2620">Enabled</text>
    <text x="580" y="218" fill="#4d5850">Turned on in Gemini, Copilot…</text>
  </g>
  <g stroke="#4d5850" stroke-width="1.5" marker-end="url(#a)">
    <line x1="168" y1="236" x2="168" y2="270"/><line x1="424" y1="236" x2="424" y2="270"/><line x1="680" y1="236" x2="680" y2="270"/>
  </g>

  <!-- Intake and risk -->
  <rect x="48" y="274" width="752" height="70" fill="#fffdf8" stroke="#ddd4c2"/>
  <text x="68" y="303" font-size="17" font-weight="600" fill="#1b2620">Intake that adapts to the path</text>
  <text x="68" y="327" font-size="14" fill="#4d5850">Builders, procurers and enablers each get the questions they can actually answer</text>
  <line x1="800" y1="309" x2="836" y2="309" stroke="#4d5850" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="840" y="274" width="312" height="70" fill="#fffdf8" stroke="#ddd4c2"/>
  <text x="860" y="303" font-size="17" font-weight="600" fill="#1b2620">Risk questions</text>
  <text x="860" y="327" font-size="14" fill="#4d5850">Five answers set the tier and reviewers</text>
  <line x1="424" y1="344" x2="424" y2="378" stroke="#4d5850" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Shared record -->
  <rect x="48" y="382" width="1104" height="76" fill="#1f4d3a"/>
  <text x="600" y="414" text-anchor="middle" font-size="19" font-weight="600" fill="#fffdf8">One shared system record</text>
  <text x="600" y="440" text-anchor="middle" font-size="14" fill="#d3e2d7">Created at registration. Every assigned reviewer sees it from day one. Compared against your own approved policy set.</text>

  <!-- Role views -->
  <text x="48" y="494" font-size="12" font-weight="600" letter-spacing="1" fill="#4d5850">FIVE VIEWS OF THE SAME RECORD</text>
  <g font-size="13">
    <rect x="48" y="506" width="208" height="96" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="64" y="532" font-size="15" font-weight="600" fill="#1b2620">Implementer</text>
    <text x="64" y="554" fill="#4d5850">Own systems and tasks</text>
    <text x="64" y="574" fill="#4d5850">Can't override a block</text>
    <rect x="272" y="506" width="208" height="96" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="288" y="532" font-size="15" font-weight="600" fill="#1b2620">Reviewer</text>
    <text x="288" y="554" fill="#4d5850">Assigned queue only</text>
    <text x="288" y="574" fill="#4d5850">Raises flags and blocks</text>
    <rect x="496" y="506" width="208" height="96" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="512" y="532" font-size="15" font-weight="600" fill="#1b2620">Accountable owner</text>
    <text x="512" y="554" fill="#4d5850">Business unit view</text>
    <text x="512" y="574" fill="#4d5850">Disputes go to committee</text>
    <rect x="720" y="506" width="208" height="96" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="736" y="532" font-size="15" font-weight="600" fill="#1b2620">Executive</text>
    <text x="736" y="554" fill="#4d5850">Org-wide totals</text>
    <text x="736" y="574" fill="#4d5850">Override history</text>
    <rect x="944" y="506" width="208" height="96" fill="#fffdf8" stroke="#ddd4c2"/>
    <text x="960" y="532" font-size="15" font-weight="600" fill="#1b2620">Governance lead</text>
    <text x="960" y="554" fill="#4d5850">Policy set, overlap check</text>
    <text x="960" y="574" fill="#4d5850">Routes findings to owners</text>
  </g>

  <!-- Lifecycle -->
  <text x="48" y="640" font-size="12" font-weight="600" letter-spacing="1" fill="#4d5850">LIFECYCLE</text>
  <g font-size="14" text-anchor="middle">
    <rect x="48" y="652" width="200" height="40" fill="#d3e2d7"/><text x="148" y="677" fill="#1b2620">Registered</text>
    <rect x="274" y="652" width="200" height="40" fill="#f0e3c6"/><text x="374" y="677" fill="#1b2620">In review</text>
    <rect x="500" y="652" width="200" height="40" fill="#d3e2d7"/><text x="600" y="677" fill="#1b2620">Approved</text>
    <rect x="726" y="652" width="200" height="40" fill="#d3e2d7"/><text x="826" y="677" fill="#1b2620">Production</text>
    <rect x="952" y="652" width="200" height="40" fill="#e3e1d9"/><text x="1052" y="677" fill="#1b2620">Decommission</text>
  </g>
  <g stroke="#4d5850" stroke-width="1.5" marker-end="url(#a)">
    <line x1="248" y1="672" x2="270" y2="672"/><line x1="474" y1="672" x2="496" y2="672"/><line x1="700" y1="672" x2="722" y2="672"/><line x1="926" y1="672" x2="948" y2="672"/>
  </g>

  <!-- Record and counsel -->
  <rect x="48" y="716" width="752" height="84" fill="#ece5d3"/>
  <line x1="48" y1="716" x2="800" y2="716" stroke="#1f4d3a" stroke-width="2"/>
  <text x="68" y="748" font-size="17" font-weight="600" fill="#1b2620">A permanent record of decisions</text>
  <text x="68" y="774" font-size="14" fill="#4d5850">Every flag, block, override and approval: who, what and when. Not a place for legal advice.</text>
  <rect x="816" y="716" width="336" height="84" fill="#fffdf8" stroke="#857c6b" stroke-dasharray="5 4"/>
  <text x="836" y="748" font-size="17" font-weight="600" fill="#1b2620">Your counsel, outside Tandem</text>
  <text x="836" y="774" font-size="14" fill="#4d5850">The record shows only that counsel</text>
  <text x="836" y="792" font-size="14" fill="#4d5850">was consulted, and when.</text>

  <text x="48" y="836" font-size="12" fill="#4d5850">Tandem · privacy by design applied to AI governance · Informational only, not legal advice</text>
</svg>
